<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estratégia Empresarial | DISC Dashboard</title>

    <!-- FAVICON -->
    <link rel="icon" href="static/imagens/favicon.ico">

    <!-- CSS -->
    <link rel="stylesheet" href="static/css/auth.css">
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/quiz.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/polimento.css">
</head>
<body>

<!-- ================================================================== -->
<!-- SIDEBAR -->
<!-- ================================================================== -->
<aside id="sidebar" class="sidebar">
    <span class="sidebar-fechar"><i class="fas fa-times"></i></span>

    <nav class="sidebar-menu">

        <button class="menu-item" data-page="index" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i>
            <span>Início</span>
        </button>

        <button class="menu-item" data-page="teste_disc" onclick="window.location.href='teste_disc.html'">
            <i class="fas fa-user-circle"></i>
            <span>DISC</span>
        </button>

        <button class="menu-item" data-page="recruta" onclick="window.location.href='recruta.html'">
            <i class="fas fa-users-cog"></i>
            <span>DISC Recruta</span>
        </button>

        <button class="menu-item" data-page="insights_ia" onclick="window.location.href='insights_ia.html'">
            <i class="fas fa-lightbulb"></i>
            <span>Insights & IA</span>
        </button>

        <button class="menu-item" data-page="biblioteca" onclick="window.location.href='biblioteca.html'">
            <i class="fas fa-book-reader"></i><span>Casos de Uso DISC</span>
        </button>
        <button class="menu-item" data-page="estrategia" onclick="window.location.href='estrategia.html'">
            <i class="fas fa-chess"></i><span>Estratégia Empresarial</span>
        </button>

        <button class="menu-item" data-page="quiz" onclick="window.location.href='quiz.html'">
            <i class="fas fa-question-circle"></i>
            <span>Quiz para Aulas</span>
        </button>

        <button class="menu-item" data-page="casos" onclick="window.location.href='casos.html'">
            <i class="fas fa-book-open"></i>
            <span>Casos de Liderança</span>
        </button>

        <button class="menu-item" data-page="feedback" onclick="window.location.href='feedback.html'">
            <i class="fas fa-comments"></i>
            <span>Simulador Feedback</span>
        </button>

        <button class="menu-item" data-page="dinamicas" onclick="window.location.href='dinamicas.html'">
            <i class="fas fa-users"></i>
            <span>Dinâmicas & Empatia</span>
        </button>

        <button class="menu-item" data-page="noticias_rh" onclick="window.location.href='noticias_rh.html'">
            <i class="fas fa-newspaper"></i>
            <span>Notícias de RH</span>
        </button>

        <button class="menu-item" data-page="configuracoes" onclick="window.location.href='configuracoes.html'">
            <i class="fas fa-cog"></i>
            <span>Configurações</span>
        </button>

    </nav>

    <div class="sidebar-logo">
        <span class="dev-label">Desenvolvido por</span>
        <img src="static/imagens/logo1.png" alt="Logo CRV">
    </div>

    <button id="btnMenu" class="sidebar-toggle">
        <i class="fas fa-chevron-left"></i>
    </button>

</aside>

<!-- ================================================================== -->
<!-- HEADER SUPERIOR -->
<!-- ================================================================== -->
<header class="header">

    <!-- BOTÃO HAMBÚRGUER (mobile) -->
    <button id="btnMenuMobile" class="btn-menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- LOGO + TÍTULO -->
    <div class="header-left">
        <img src="static/imagens/logo_disc.png" alt="DISC" class="logo-header">

        <div class="header-titles">
            <span class="titulo">Dashboard</span>
            <span class="subtitulo"><strong>Painel de Gestão Comportamental</strong></span>
        </div>
    </div>

    <!-- BUSCA -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar no painel...">
        <i class="fas fa-search"></i>
    </div>

    <!-- ÁREA DIREITA -->
    <div class="header-right">

        <!-- RELÓGIO -->
        <span id="relogio" class="clock">00:00:00</span>

        <!-- CLIMA + DROPDOWN -->
        <div class="weather-box" id="weatherBox">

            <!-- ÍCONE DO CLIMA -->
            <img id="iconeClimaImg" src="static/imagens/ico_dia.png" alt="clima" class="icone-clima-img">

            <!-- TEMPERATURA -->
            <span id="temperatura" class="temperature">19°C</span>

            <!-- DROPDOWN COMPLETO -->
            <div id="modalClima" class="modal-clima">
                <div class="modal-clima-content">

                    <div class="modal-clima-header">
                        <h3>São Paulo - BR</h3>
                        <button class="modal-clima-close" id="closeModalClima">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <div class="modal-clima-body" id="modalClimaBody">
                        <div class="previsao-dia">
                            <p class="dia-nome">qui.</p>
                            <p class="temperaturas">24° / 16°</p>
                            <p class="emoji-clima">☁️</p>
                        </div>

                        <div class="previsao-dia">
                            <p class="dia-nome">sex.</p>
                            <p class="temperaturas">33° / 15°</p>
                            <p class="emoji-clima">☀️</p>
                        </div>

                        <div class="previsao-dia">
                            <p class="dia-nome">sáb.</p>
                            <p class="temperaturas">32° / 21°</p>
                            <p class="emoji-clima">☀️</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- BOTÃO TEMA -->
        <button id="btnTema" class="btn-tema">
            <i class="fas fa-moon"></i>
        </button>

        <!-- USUÁRIO -->
        <div class="user-box">


    </div>

</header>

<!-- ================================================================== -->
<!-- CONTEÚDO PRINCIPAL -->
<!-- ================================================================== -->
<main class="main-content estrategia-main">
    <div class="card-principal">
        <h1 class="dashboard-title"><i class="fas fa-chess"></i> Estratégia Empresarial</h1>
        <p class="dashboard-subtitle">Quatro ferramentas para conectar decisões de negócio, competências e gestão de pessoas.</p>
    </div>
    <nav class="estrategia-tabs" aria-label="Ferramentas de estratégia">
        <button data-ferramenta="swot" class="active" aria-pressed="true">Análise SWOT</button>
        <button data-ferramenta="porter" aria-pressed="false">Cinco Forças</button>
        <button data-ferramenta="bcg" aria-pressed="false">Matriz BCG</button>
        <button data-ferramenta="ansoff" aria-pressed="false">Matriz Ansoff</button>
    </nav>
    <article id="ferramentaEstrategia" class="estrategia-painel"></article>
    <div class="estrategia-acoes">
        <a id="quizEstrategia" class="btn-acao btn-reiniciar" href="quiz.html?tema=swot"><i class="fas fa-question-circle"></i> Praticar no quiz</a>
        <button id="imprimirEstrategia" class="btn-modal btn-imprimir" data-admin-only hidden aria-hidden="true"><i class="fas fa-print"></i> Imprimir para Aula</button>
    </div>
</main>
<script src="static/js/app_config.js"></script><script src="static/js/auth.js"></script>
<script src="static/js/main.js"></script><script src="static/js/busca.js"></script>
<script src="static/js/configuracoes.js"></script><script src="static/js/referencias.js"></script>
<script src="static/js/estrategia.js"></script></body></html>
